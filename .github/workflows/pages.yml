name: pages

# A push to main used to BE the publication: GitHub Pages served the branch
# as-is and nothing ran between the commit hook and the internet. Now the
# gates run here first and the site deploys from this workflow only if they
# pass. A push that fails stays in git and is never served; the last good
# deployment keeps serving.
#
# What this cannot check: the names class of check-publishable. rux-ln-atlas
# is private and its list is never shipped here, so that class reports
# `unavailable` in CI. On the sync route that is covered upstream: atlas's
# emit.py sweeps every document it writes against the same list and writes
# nothing if a name survives, on the private side where a printed match is
# harmless. CI cannot read atlas, so the data route is closed another way:
# check-data compares data/guides/ against the hash sync-guides.sh recorded
# in its PIN, and data that did not come through atlas fails here before it
# is built, with no name in sight. Two routes remain, and AGENTS.md records
# them as the accepted case: a generator that injects text, and a hand-written
# page or Markdown file, each needing the owner to type a name AND commit with
# the hook bypassed or never armed. On a machine with the sibling checkout
# the hook refuses; outside CI a missing list is a refusal too; and a check
# that runs after a push could stop a deployment, never a disclosure. The
# other four classes, and every other gate, run here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: site

      # check-ancestry needs rux-ds beside this repository, at the commit the
      # vendored copy was taken from -- the PIN says which.
      - id: pin
        run: echo "sha=$(awk '/^commit/{print $2}' site/vendor/rux-ds/PIN)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: rux-sm/rux-ds
          ref: ${{ steps.pin.outputs.sha }}
          path: rux-ds

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # THE PAGES ARE GENERATED AND COMMITTED. Rebuild, and refuse a push whose
      # committed pages differ from what data/guides/ produces -- the
      # sync-then-build step a person used to have to remember. rux-ds CI
      # holds css/ and its README the same way.
      - run: |
          node tools/build.mjs
          if ! git diff --quiet -- guides index.html; then
            git diff --stat -- guides index.html
            echo "committed pages are stale -- run node tools/build.mjs and commit"
            exit 1
          fi
        working-directory: site

      - run: node tools/check.mjs
        working-directory: site
        env:
          DS: ../rux-ds

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
